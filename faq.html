            <h1 data-en="Frequently Asked Questions" data-es="Preguntas Frecuentes" data-fr="Questions Fréquentes"></h1>
            <p data-en="Answers for distributors and trade partners on pricing, MOQs, lead times, and how to get started." data-es="Respuestas para distribuidores y socios sobre precios, MOQ, plazos de entrega y cómo empezar." data-fr="Réponses pour distributeurs et partenaires sur les prix, quantités minimales, délais et démarrage."></p>

    <section>
        <div class="section-container">
            <div class="faq-group">
                <div class="faq-cat">
                    <h2 class="faq-cat-title" data-en="Distribution Partnership" data-es="Asociación de Distribución" data-fr="Partenariat de Distribution"></h2>
                    <details class="faq-item">
                        <summary data-en="Who can become a FIXORA distribution partner?" data-es="¿Quién puede convertirse en socio de distribución de FIXORA?" data-fr="Qui peut devenir partenaire de distribution FIXORA ?"></summary>
                        <div class="faq-answer" data-en="We work with distributors, wholesalers, lumber yards, and trade suppliers serving the US and Canada." data-es="Trabajamos con distribuidores, mayoristas, depósitos de materiales y proveedores del sector en EE. UU. y Canadá." data-fr="Nous travaillons avec des distributeurs, grossistes, négoces de matériaux et fournisseurs aux États-Unis et au Canada."></div>
                    </details>
                    <details class="faq-item">
                        <summary data-en="Do you have minimum order quantities (MOQ)?" data-es="¿Tienen cantidades mínimas de pedido (MOQ)?" data-fr="Avez-vous des quantités minimales de commande (MOQ) ?"></summary>
                        <div class="faq-answer" data-en="Yes, and they&#x27;re kept practical. MOQs vary by line — our sales team will give you the numbers for the categories you plan to carry." data-es="Sí, y se mantienen prácticos. Los MOQ varían por línea: nuestro equipo de ventas le dará las cifras de las categorías que planea manejar." data-fr="Oui, et elles restent réalistes. Les minimums varient selon la gamme : notre équipe vous donnera les chiffres pour vos catégories."></div>
                    </details>
                    <details class="faq-item">
                        <summary data-en="Do you offer exclusive distribution opportunities?" data-es="¿Ofrecen oportunidades de distribución exclusiva?" data-fr="Proposez-vous des opportunités de distribution exclusive ?"></summary>
                        <div class="faq-answer" data-en="Territory arrangements are available for qualified partners, case by case. Contact sales to discuss your market." data-es="Hay acuerdos territoriales disponibles para socios calificados, caso por caso. Contacte a ventas para hablar de su mercado." data-fr="Des accords territoriaux sont possibles pour les partenaires qualifiés, au cas par cas. Contactez le service commercial."></div>
                    </details>
                    <details class="faq-item">
                        <summary data-en="How do I become a distributor?" data-es="¿Cómo me convierto en distribuidor?" data-fr="Comment devenir distributeur ?"></summary>
                        <div class="faq-answer" data-en="Send an inquiry from the Partner or Contact page. After a short review of your business, we&#x27;ll follow up with wholesale pricing, terms, and next steps." data-es="Envíe una consulta desde la página Asóciese o Contacto. Tras una breve revisión de su negocio, le responderemos con precios mayoristas, términos y próximos pasos." data-fr="Envoyez une demande depuis la page Partenariat ou Contact. Après un bref examen de votre activité, nous reviendrons avec prix de gros, conditions et prochaines étapes."></div>
                    </details>
                </div>
                <div class="faq-cat">
                    <h2 class="faq-cat-title" data-en="Products" data-es="Productos" data-fr="Produits"></h2>
                    <details class="faq-item">
                        <summary data-en="What product categories does FIXORA offer?" data-es="¿Qué categorías de productos ofrece FIXORA?" data-fr="Quelles catégories de produits FIXORA propose-t-elle ?"></summary>
                        <div class="faq-answer" data-en="Four lines: smart locks, door hardware, door hardware accessories, and cabinet and furniture hardware. The range is intentionally focused so it&#x27;s easy to stock and sell." data-es="Cuatro líneas: cerraduras inteligentes, herrajes para puertas, accesorios y herrajes para gabinetes y muebles. La gama es enfocada a propósito para facilitar el inventario y la venta." data-fr="Quatre gammes : serrures connectées, quincaillerie de porte, accessoires et quincaillerie de meuble. L&#x27;offre est volontairement ciblée pour être facile à stocker et à vendre."></div>
                    </details>
                    <details class="faq-item">
                        <summary data-en="Can I request product catalogs or technical specifications?" data-es="¿Puedo solicitar catálogos de productos o especificaciones técnicas?" data-fr="Puis-je demander des catalogues produits ou des spécifications techniques ?"></summary>
                        <div class="faq-answer" data-en="Yes. Downloadable catalogs are in the Resources section, and our sales team can send detailed specs or drawings on request." data-es="Sí. Los catálogos descargables están en la sección Recursos, y nuestro equipo de ventas puede enviar especificaciones o planos detallados a solicitud." data-fr="Oui. Les catalogues téléchargeables sont dans la section Ressources, et notre équipe peut envoyer des spécifications ou plans détaillés sur demande."></div>
                    </details>
                    <details class="faq-item">
                        <summary data-en="Do you support private label or OEM projects?" data-es="¿Admiten proyectos de marca privada u OEM?" data-fr="Prenez-vous en charge les projets de marque privée ou OEM ?"></summary>
                        <div class="faq-answer" data-en="Yes. Because we source factory-direct, we can run private label and OEM programs for qualified partners. Send your requirements and we&#x27;ll advise on feasibility and volumes." data-es="Sí. Al comprar directo de fábrica, podemos ejecutar programas de marca propia y OEM para socios calificados. Envíe sus requisitos y le asesoraremos sobre viabilidad y volúmenes." data-fr="Oui. Comme nous achetons directement à l&#x27;usine, nous pouvons gérer des programmes de marque privée et OEM pour les partenaires qualifiés. Envoyez vos exigences et nous évaluerons faisabilité et volumes."></div>
                    </details>
                </div>
                <div class="faq-cat">
                    <h2 class="faq-cat-title" data-en="Supply &amp; Logistics" data-es="Suministro y Logística" data-fr="Approvisionnement et Logistique"></h2>
                    <details class="faq-item">
                        <summary data-en="Do you stock inventory in the US?" data-es="¿Mantienen inventario en EE. UU.?" data-fr="Avez-vous du stock aux États-Unis ?"></summary>
                        <div class="faq-answer" data-en="Yes. We hold stock at our Ontario, California distribution center so core items ship without an ocean freight wait." data-es="Sí. Mantenemos inventario en nuestro centro de distribución de Ontario, California, para que los artículos principales se envíen sin esperar flete marítimo." data-fr="Oui. Nous tenons du stock à notre centre de distribution d&#x27;Ontario, en Californie : les articles courants partent sans attendre le fret maritime."></div>
                    </details>
                    <details class="faq-item">
                        <summary data-en="What are your typical lead times?" data-es="¿Cuáles son sus plazos de entrega típicos?" data-fr="Quels sont vos délais de livraison habituels ?"></summary>
                        <div class="faq-answer" data-en="In-stock items ship promptly from California. For replenishment or larger programs, we confirm lead times when you order." data-es="Los artículos en inventario se envían con prontitud desde California. Para reposición o programas mayores, confirmamos los plazos al momento del pedido." data-fr="Les articles en stock partent rapidement de Californie. Pour le réassort ou les programmes plus importants, nous confirmons les délais à la commande."></div>
                    </details>
                    <details class="faq-item">
                        <summary data-en="Can you support large-volume orders?" data-es="¿Pueden atender pedidos de gran volumen?" data-fr="Pouvez-vous gérer des commandes de grand volume ?"></summary>
                        <div class="faq-answer" data-en="Yes. Direct factory access plus ProBuilder US lets us handle large-volume and recurring orders. Talk to sales for volume planning." data-es="Sí. El acceso directo a fábrica junto con ProBuilder US nos permite manejar pedidos de gran volumen y recurrentes. Hable con ventas para planificar volúmenes." data-fr="Oui. L&#x27;accès direct à l&#x27;usine et ProBuilder US nous permettent de traiter les commandes de gros volume et récurrentes. Contactez le service commercial."></div>
                    </details>
                </div>
                <div class="faq-cat">
                    <h2 class="faq-cat-title" data-en="Support &amp; Warranty" data-es="Soporte y Garantía" data-fr="Support et Garantie"></h2>
                    <details class="faq-item">
                        <summary data-en="Do you provide technical support?" data-es="¿Ofrecen soporte técnico?" data-fr="Fournissez-vous un support technique ?"></summary>
                        <div class="faq-answer" data-en="Yes. Our Ontario, California team handles product questions, spec help, and after-sales support for you and your customers." data-es="Sí. Nuestro equipo en Ontario, California, atiende preguntas de producto, especificaciones y soporte posventa para usted y sus clientes." data-fr="Oui. Notre équipe d&#x27;Ontario, en Californie, traite les questions produit, les spécifications et le service après-vente."></div>
                    </details>
                    <details class="faq-item">
                        <summary data-en="What warranty do your products include?" data-es="¿Qué garantía incluyen sus productos?" data-fr="Quelle garantie vos produits incluent-ils ?"></summary>
                        <div class="faq-answer" data-en="FIXORA products carry a manufacturer's warranty against defects in materials and workmanship. Specific terms vary by product line — contact us for details." data-es="Los productos FIXORA cuentan con una garantía del fabricante contra defectos de materiales y mano de obra. Las condiciones específicas varían según la línea de productos — contáctenos para más detalles." data-fr="Les produits FIXORA bénéficient d'une garantie fabricant contre les défauts de matériaux et de fabrication. Les conditions précises varient selon la gamme — contactez-nous pour plus de détails."></div>
                    </details>
                </div>
                <div class="faq-cat">
                    <h2 class="faq-cat-title" data-en="Business &amp; Service" data-es="Negocio y Servicio" data-fr="Entreprise et Service"></h2>
                    <details class="faq-item">
                        <summary data-en="Which markets do you currently serve?" data-es="¿Qué mercados atienden actualmente?" data-fr="Quels marchés desservez-vous actuellement ?"></summary>
                        <div class="faq-answer" data-en="The North American trade — distributors, lumber yards, builders, and specifiers across the United States and Canada." data-es="El sector en América del Norte: distribuidores, depósitos de materiales, constructores y especificadores en Estados Unidos y Canadá." data-fr="Le marché nord-américain : distributeurs, négoces, constructeurs et prescripteurs aux États-Unis et au Canada."></div>
                    </details>
                    <details class="faq-item">
                        <summary data-en="Why work with FIXORA instead of importing yourself?" data-es="¿Por qué trabajar con FIXORA en lugar de importar por su cuenta?" data-fr="Pourquoi travailler avec FIXORA plutôt qu&#x27;importer soi-même ?"></summary>
                        <div class="faq-answer" data-en="You still get factory-direct pricing — but with stock in California, a sales team in your time zone, and someone accountable when an order needs fixing." data-es="Sigue obteniendo precios directos de fábrica, pero con inventario en California, un equipo de ventas en su zona horaria y alguien responsable cuando un pedido necesita corregirse." data-fr="Vous conservez les prix directs d&#x27;usine, avec du stock en Californie, une équipe dans votre fuseau horaire et un interlocuteur responsable en cas de problème."></div>
                    </details>
                    <details class="faq-item">
                        <summary data-en="How can I contact your sales team?" data-es="¿Cómo puedo contactar a su equipo de ventas?" data-fr="Comment puis-je contacter votre équipe commerciale ?"></summary>
                        <div class="faq-answer" data-en="Email service@fixora-hardware.com or use our Contact page. We'll respond promptly with the information you need." data-es="Escriba a service@fixora-hardware.com o utilice nuestra página de Contacto. Le responderemos con prontitud con la información que necesita." data-fr="Écrivez à service@fixora-hardware.com ou utilisez notre page Contact. Nous vous répondrons rapidement avec les informations dont vous avez besoin."></div>
                    </details>
                </div>
            </div>
        </div>
    </section>
